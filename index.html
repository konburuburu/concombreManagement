<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>コンコンブル所持チェッカー</title>
</head>
<body>

  <h2>スプレッドシートへ送信</h2>
  <form id="myForm">
    <input type="text" id="name" placeholder="お名前" required><br><br>
    <input type="text" id="message" placeholder="メッセージ" required><br><br>
    <button type="submit">送信する</button>
  </form>
  <script>
    // GASの最新WEBアプリURL（/exec まで）を貼り付け
    const GAS_URL = "https://script.google.com/macros/s/AKfycbzkzImKlMNZgKCqiuumr396EIg1baSBNOIDrdcHk_XJpKHlgn0igdGH9_swMYvbfMVB_g/exec";

    document.getElementById("myForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      
      // 送信するデータを作成
      const formData = {
        name: document.getElementById("name").value,
        message: document.getElementById("message").value
      };

      try {
        // GASへデータを送信
        const response = await fetch(GAS_URL, {
          method: "POST",
          body: JSON.stringify(formData)
        });
        
        const result = await response.json();
        if (result.status === "success") {
          alert("送信が完了しました！");
          document.getElementById("myForm").reset();
        } else {
          alert("エラーが発生しました: " + result.message);
        }
      } catch (error) {
        alert("通信に失敗しました。時間をおいて再度お試しください。");
      }
    });
  </script>
</body>
</html>
